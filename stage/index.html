<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>升堂 · 六部制朝堂协作 v0.2</title>
<style>
:root{
  --gold:#d8b26a;
  --gold-b:#f4dfae;
  --cinnabar:#c0392b;
  --cinnabar-b:#e0523f;
  --paper:#f0e5cc;
  --paper-2:#e2d3b0;
  --ink:#2a1a12;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#050403}
body{font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;-webkit-font-smoothing:antialiased}
.viewport{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,#130b08 0%,#050403 72%)}
.stage-wrap{width:1600px;height:900px;transform-origin:center center}
.stage{position:absolute;inset:0;width:1600px;height:900px;overflow:hidden;background:#0a0605;transform-origin:center center}

/* ============ 天幕 / 浮尘 ============ */
.sky{position:absolute;inset:0;z-index:1;background:
  radial-gradient(ellipse 70% 48% at 50% 10%,rgba(196,126,62,.16),transparent 70%),
  radial-gradient(ellipse 90% 55% at 50% 102%,rgba(128,44,26,.20),transparent 70%),
  linear-gradient(180deg,#170d09 0%,#0d0706 46%,#080505 100%)}
.dust{position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:radial-gradient(circle,rgba(240,215,160,.55) 0 1px,transparent 1.4px);
  opacity:.30}
.dust.d1{background-size:150px 150px;animation:drift1 34s linear infinite}
.dust.d2{background-size:230px 230px;opacity:.16;animation:drift2 52s linear infinite}
@keyframes drift1{from{background-position:0 0}to{background-position:150px 300px}}
@keyframes drift2{from{background-position:0 0}to{background-position:-230px 460px}}

/* ============ 地面 ============ */
.floor{position:absolute;left:0;right:0;top:480px;bottom:0;z-index:3;
  background:linear-gradient(180deg,#22110c,#140907 58%,#0b0505)}
.floor:before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(to bottom,rgba(216,178,106,.075) 0 1px,transparent 1px 52px);
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 26%,#000 72%,transparent);
  mask-image:linear-gradient(to bottom,transparent,#000 26%,#000 72%,transparent)}
.floor:after{content:"";position:absolute;left:50%;top:0;width:1100px;height:100%;transform:translateX(-50%);
  background:radial-gradient(ellipse at 50% 0%,rgba(232,182,112,.20),transparent 62%)}

/* 堂前光斑（把视线压到案几） */
.spot{position:absolute;left:50%;top:560px;width:1080px;height:420px;z-index:7;
  transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(ellipse at 50% 62%,rgba(255,196,120,.13),rgba(255,170,90,.05) 42%,transparent 72%)}
.vignette{position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(ellipse 78% 74% at 50% 46%,transparent 42%,rgba(0,0,0,.62) 100%)}

/* 堂前甬道 */
.carpet{position:absolute;left:440px;top:636px;width:720px;height:264px;z-index:9;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(126,32,23,.34),rgba(84,20,14,.10));
  clip-path:polygon(24% 0,76% 0,100% 100%,0 100%);
  border-left:1px solid rgba(216,178,106,.10);border-right:1px solid rgba(216,178,106,.10)}

/* ============ 屏风 ============ */
.screen{position:absolute;left:500px;top:128px;width:600px;height:384px;z-index:4;
  background:linear-gradient(158deg,#241010,#301612 46%,#1a0a09);
  border:2px solid rgba(216,178,106,.30);
  box-shadow:inset 0 0 80px rgba(0,0,0,.85),0 22px 60px rgba(0,0,0,.7)}
.screen:before{content:"";position:absolute;inset:12px;border:1px solid rgba(216,178,106,.14)}
.screen-char{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
  font-family:"STKaiti","KaiTi","Kaiti SC",serif;font-size:186px;line-height:1;
  color:rgba(216,178,106,.085);user-select:none}

/* ============ 横梁 / 立柱 ============ */
.beam{position:absolute;left:0;right:0;top:0;height:86px;z-index:6;
  background:linear-gradient(180deg,#4d2318,#2a110c);
  border-bottom:2px solid rgba(216,178,106,.5);
  box-shadow:0 12px 34px rgba(0,0,0,.65)}
.beam:after{content:"";position:absolute;left:0;right:0;bottom:7px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(216,178,106,.75),transparent)}
.pillar{position:absolute;top:86px;bottom:0;width:78px;z-index:6;
  background:linear-gradient(90deg,#33150e,#5a2a1b 42%,#280f08);
  border-left:1px solid rgba(216,178,106,.14);
  border-right:1px solid rgba(0,0,0,.65)}
.pillar.l{left:36px}
.pillar.r{right:36px}
.pillar:before{content:"";position:absolute;left:-12px;right:-12px;top:-14px;height:22px;
  background:linear-gradient(180deg,#6f3d26,#38190f);
  border:1px solid rgba(216,178,106,.32)}

/* ============ 队员 ============ */
.courtiers{position:absolute;inset:0;z-index:10}
.courtier{position:absolute;width:96px;height:140px;transform-origin:bottom center;
  transition:filter .5s,opacity .5s}
.courtier svg{width:96px;height:126px;display:block;color:#4a2a1d;
  transition:color .55s,filter .55s;
  filter:drop-shadow(0 0 1px rgba(216,178,106,.30))}
.courtier.lit svg{color:#8a4a2e;filter:drop-shadow(0 0 16px rgba(224,82,63,.5))}
.lantern{position:absolute;left:50%;top:-46px;width:16px;height:21px;transform:translateX(-50%);
  border-radius:50% 50% 44% 44%;
  background:radial-gradient(circle at 50% 34%,#6e2015,#2e0b06);
  border:1px solid rgba(216,178,106,.26);
  box-shadow:0 0 0 rgba(224,82,63,0);
  transition:background .45s,box-shadow .6s}
.lantern:before{content:"";position:absolute;left:50%;top:-14px;width:1px;height:14px;
  transform:translateX(-50%);background:rgba(216,178,106,.26)}
.courtier.lit .lantern{background:radial-gradient(circle at 50% 34%,#ffe3b4,#e0523f 58%,#8a2b1e);
  box-shadow:0 0 28px 9px rgba(224,82,63,.55),0 0 70px 26px rgba(224,82,63,.18)}
/* 勘验时其他司压暗：只留刑部在场。压暗但不压死——还能看出人形，只是退到背景 */
.courtier.dim{opacity:.55}
.courtier.dim svg{color:#4a2a1d;filter:drop-shadow(0 0 1px rgba(216,178,106,.22))}
.courtier.dim .nameplate{color:rgba(216,178,106,.34)}
.courtier.dim .lantern{background:radial-gradient(circle at 50% 34%,#42160e,#1b0604);
  box-shadow:0 0 0 rgba(0,0,0,0)}

/* 名牌：认得出是谁 */
.nameplate{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);
  font-size:12.5px;letter-spacing:.16em;white-space:nowrap;
  color:rgba(216,178,106,.55);transition:color .3s,text-shadow .3s;
  text-shadow:0 1px 4px rgba(0,0,0,.9)}
/* 腰间色带：六个司各有颜色 */
.sash{position:absolute;left:50%;top:72px;width:32px;height:4px;
  transform:translateX(-50%);border-radius:2px;opacity:.7;transition:opacity .3s}

/* 状态动作：不靠弹窗，靠人和灯的动静 */
.courtier[data-state="thinking"] svg{animation:sway 1.5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-2deg)}}
.courtier[data-state="thinking"] .lantern{animation:flicker 1.1s ease-in-out infinite}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.45}}
.courtier[data-state="blocked"] .nameplate{color:#ff6a52;text-shadow:0 0 12px rgba(224,82,63,.7)}
.courtier[data-state="blocked"] svg{animation:jitter .3s linear infinite}
@keyframes jitter{0%,100%{transform:translateX(0)}50%{transform:translateX(2.5px)}}
.courtier[data-state="done"] .nameplate{color:rgba(216,178,106,.85)}
.courtier{cursor:pointer}

/* 悬停：职责。挂在舞台上，不跟着人的缩放变大变小 */
.duty{position:absolute;z-index:80;pointer-events:none;width:196px;
  padding:9px 12px 10px;background:rgba(18,9,7,.94);color:rgba(240,229,204,.92);
  border:1px solid rgba(216,178,106,.48);border-radius:2px;
  box-shadow:0 12px 28px rgba(0,0,0,.55);opacity:0;
  transition:opacity .16s}
.duty.on{opacity:1}
.duty b{display:block;margin-bottom:4px;font-family:"STKaiti","KaiTi",serif;
  font-size:16px;font-weight:normal;letter-spacing:.22em;color:var(--gold-b)}
.duty p{margin:0;font-size:13px;line-height:1.55;letter-spacing:.04em}

/* ============ 气泡 ============ */
.bubble{position:absolute;padding:5px 13px;background:rgba(240,229,204,.95);color:#2a1a12;
  font-size:14px;letter-spacing:.10em;border-radius:2px;white-space:nowrap;
  opacity:0;transform:translate(-50%,10px) scale(.9);pointer-events:none;
  box-shadow:0 8px 22px rgba(0,0,0,.5);z-index:12}
.bubble:after{content:"";position:absolute;left:50%;bottom:-4px;width:9px;height:9px;
  transform:translateX(-50%) rotate(45deg);background:inherit}
.bubble.show{animation:bubbleIn .38s cubic-bezier(.2,.9,.3,1.35) forwards}
.bubble.hide{animation:bubbleOut .3s forwards}
.bubble.dissent{background:rgba(192,57,43,.96);color:#fbe9c8;box-shadow:0 8px 26px rgba(192,57,43,.55)}
@keyframes bubbleIn{to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bubbleOut{to{opacity:0;transform:translate(-50%,-12px) scale(.94)}}
.courtier .bubble{left:50%;bottom:calc(100% + 6px)}

/* ============ 中堂 ============ */
/* 平日站在右柱与工部之间的空档，略收一点才站得下。升堂时再走到堂前。 */
.zhongtang{position:absolute;left:1322px;top:560px;width:160px;height:290px;z-index:42;
  opacity:1;transform:scale(.82);transform-origin:bottom center;cursor:pointer;
  transition:left .55s cubic-bezier(.22,.75,.3,1),top .55s cubic-bezier(.22,.75,.3,1),transform .55s cubic-bezier(.22,.75,.3,1)}
.zhongtang.enter{left:860px;top:340px;transform:scale(1);transition-duration:1.35s}
.zhongtang.enter svg{animation:stride .32s ease-in-out 4}
@keyframes stride{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* 卷轴打开时中堂侍立右侧：不挡单子，也不挡六司 */
.zhongtang.aside{left:1075px;top:240px;transition-duration:.55s}
.zhongtang svg{width:160px;height:290px;display:block;color:#54291b;
  transition:color .6s,filter .6s}
.zhongtang.stand svg{color:#8b4529;filter:drop-shadow(0 10px 30px rgba(0,0,0,.75))}
.zhongtang.pose{opacity:1;transform:none;animation:none}
.bubble.zt{left:50%;bottom:calc(100% + 8px);width:520px;white-space:normal;
  background:rgba(26,12,9,.96);color:var(--gold-b);border:1px solid rgba(216,178,106,.42);
  font-size:16px;line-height:1.65;letter-spacing:.06em;text-align:left;padding:11px 16px}
.bubble.zt:after{background:rgba(26,12,9,.96);border-right:1px solid rgba(216,178,106,.42);border-bottom:1px solid rgba(216,178,106,.42)}
.bubble.zt.hide:after{display:none}

/* ============ 案几 ============ */
.desk{position:absolute;left:470px;top:750px;width:660px;height:150px;z-index:30;
  background:linear-gradient(180deg,#552818 0%,#38170a 56%,#1e0b06 100%);
  border-top:3px solid rgba(216,178,106,.5);
  clip-path:polygon(3% 0,97% 0,100% 100%,0 100%);
  box-shadow:0 -18px 50px rgba(0,0,0,.7)}
.desk:before{content:"";position:absolute;left:0;right:0;top:26px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(216,178,106,.32),transparent)}

/* 惊堂木 */
.gavel{position:absolute;right:42px;top:32px;width:80px;height:28px;
  transform-origin:18% 88%;transform:rotate(-5deg);cursor:pointer;z-index:2}
.gavel-head{position:relative;width:80px;height:28px;border-radius:3px;
  background:linear-gradient(180deg,#8b4f2e,#41190c 62%,#240c06);
  border:1px solid rgba(216,178,106,.55);
  box-shadow:0 8px 16px rgba(0,0,0,.7),inset 0 1px 0 rgba(244,223,174,.32)}
.gavel-head:after{content:"";position:absolute;left:9px;right:9px;top:12px;height:2px;
  background:rgba(216,178,106,.42)}
.gavel.raise{animation:gavelUp .17s cubic-bezier(.3,0,.6,1) forwards}
.gavel.slam{animation:gavelDown .13s cubic-bezier(.55,0,.9,1) forwards}
/* 能不能点，得看得出来：待升堂和已结案时惊堂木会呼吸，议事中暗着 */
.gavel.ready{animation:gavelBreath 3.4s ease-in-out infinite}
@keyframes gavelBreath{
  0%,100%{filter:drop-shadow(0 0 0 rgba(216,178,106,0))}
  50%{filter:drop-shadow(0 0 8px rgba(216,178,106,.6))}
}
@keyframes gavelUp{to{transform:translateY(-44px) rotate(-17deg)}}
@keyframes gavelDown{to{transform:translateY(0) rotate(-1deg)}}

/* ============ 冲击波 / 震屏 ============ */
.fx{position:absolute;inset:0;z-index:35;pointer-events:none}
.ring{position:absolute;left:1058px;top:812px;width:60px;height:60px;margin:-30px 0 0 -30px;
  border-radius:50%;border:2px solid rgba(244,223,174,.9);opacity:0}
.fx.go .ring{animation:ringOut .72s cubic-bezier(.1,.7,.3,1) forwards}
.fx.go .ring:nth-child(2){animation-delay:.10s;border-color:rgba(224,82,63,.85)}
.fx.go .ring:nth-child(3){animation-delay:.22s;border-color:rgba(244,223,174,.5)}
@keyframes ringOut{
  0%{transform:scale(.2);opacity:.95}
  100%{transform:scale(24);opacity:0}
}
.stage.shake{animation:shakeIt .52s cubic-bezier(.36,.07,.19,.97)}
@keyframes shakeIt{
  0%{transform:translate(0,0) rotate(0)}
  8%{transform:translate(-11px,7px) rotate(-.42deg)}
  17%{transform:translate(9px,-6px) rotate(.36deg)}
  26%{transform:translate(-8px,5px) rotate(-.3deg)}
  36%{transform:translate(6px,-4px) rotate(.22deg)}
  48%{transform:translate(-4px,3px) rotate(-.15deg)}
  62%{transform:translate(3px,-2px) rotate(.08deg)}
  78%{transform:translate(-1px,1px) rotate(-.03deg)}
  100%{transform:translate(0,0) rotate(0)}
}

/* ============ 状态机 HUD ============ */
.hud{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:70;
  display:flex;align-items:center;padding:8px 16px;
  background:rgba(10,6,5,.55);border:1px solid rgba(216,178,106,.22);
  border-radius:2px;backdrop-filter:blur(7px)}
.hud .step{font-size:13.5px;letter-spacing:.14em;padding:3px 10px;color:rgba(240,229,204,.30);
  transition:color .45s,text-shadow .45s,background .45s;white-space:nowrap;border-radius:2px}
.hud .step.active{color:#120806;background:linear-gradient(180deg,#f4dfae,#d8b26a);
  text-shadow:none;font-weight:600;box-shadow:0 0 18px rgba(244,223,174,.45)}
.hud .step.done{color:rgba(224,82,63,.95)}
.hud .step.done:before{content:"✓ ";font-size:11px}
.hud .sep{width:13px;height:1px;background:rgba(216,178,106,.22)}

/* ============ 输入区（奏折） ============ */
.composer{position:absolute;left:520px;top:766px;width:470px;height:118px;z-index:45;
  background:linear-gradient(180deg,rgba(240,229,204,.98),rgba(219,203,168,.96));
  border:1px solid rgba(120,80,40,.5);border-radius:2px;
  box-shadow:0 -10px 34px rgba(0,0,0,.55),0 0 0 5px rgba(88,41,27,.5);
  transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .42s}
.composer:before{content:"";position:absolute;left:-5px;right:-5px;top:-9px;height:9px;
  background:linear-gradient(180deg,#7a4429,#3b1a10);border-radius:3px 3px 0 0;
  box-shadow:0 2px 6px rgba(0,0,0,.5)}
.composer.fold{transform:translateY(130px) scale(.88);opacity:0;pointer-events:none}
.composer.err{animation:composerErr .42s}
@keyframes composerErr{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px)}40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}80%{transform:translateX(3px)}
}
.composer textarea{width:100%;height:100%;padding:15px 100px 14px 18px;border:none;outline:none;
  resize:none;background:transparent;color:var(--ink);font-family:inherit;
  font-size:16px;line-height:1.72;letter-spacing:.02em}
.composer textarea::placeholder{color:rgba(60,38,26,.42)}
.btn-send{position:absolute;right:16px;bottom:14px;width:76px;height:76px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(158deg,#c0392b,#8a1d14);
  color:#f8ebcd;border:2px solid rgba(244,223,174,.55);border-radius:5px;
  font-family:"STKaiti","KaiTi","Kaiti SC",serif;font-size:27px;line-height:1.05;
  letter-spacing:.04em;cursor:pointer;transform:rotate(-2deg);
  box-shadow:0 7px 20px rgba(150,40,25,.55),inset 0 0 0 1px rgba(0,0,0,.28);
  transition:transform .13s,box-shadow .22s}
.btn-send:hover{transform:rotate(-2deg) translateY(-2px);
  box-shadow:0 11px 26px rgba(200,60,35,.62),inset 0 0 0 1px rgba(0,0,0,.28)}
.btn-send:active{transform:rotate(-2deg) translateY(1px) scale(.96)}
.btn-send:disabled{opacity:.55;cursor:default}

/* ============ 卷轴 ============ */
/* 卷轴挂在朝堂正中（兵部与刑部之间的空档），不再遮左三部 */
.scroll{position:absolute;left:520px;top:124px;width:548px;height:624px;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .3s}
.scroll.open{opacity:1}
.scroll.open .scroll-inner{pointer-events:auto}
.scroll-inner{position:absolute;left:0;right:0;top:14px;bottom:14px;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#f4ead3,#e2d3b0 62%,#d5c39c);
  color:var(--ink);padding:26px 30px 20px;overflow-x:hidden;overflow-y:scroll;
  border-left:1px solid rgba(120,80,40,.35);border-right:1px solid rgba(120,80,40,.35);
  box-shadow:0 34px 90px rgba(0,0,0,.8),inset 0 0 60px rgba(150,110,60,.16);
  clip-path:inset(0 0 100% 0);transition:clip-path .58s cubic-bezier(.3,.8,.3,1)}
.scroll.open .scroll-inner{clip-path:inset(0 0 0 0);pointer-events:auto}
.scroll-inner > *{flex-shrink:0}
.scroll-inner::-webkit-scrollbar{width:0}
.scroll.has-leaf .scroll-inner{padding-bottom:46px}
.leaf{position:absolute;left:8px;right:8px;bottom:20px;z-index:4;height:28px;
  display:none;align-items:center;justify-content:center;gap:12px;
  pointer-events:auto;
  background:rgba(226,211,176,.96);color:#6b2118;
  font-size:13px;letter-spacing:.12em}
.scroll.open .leaf.on{display:flex}
.leaf button{padding:2px 10px;background:transparent;color:#6b2118;
  border:1px solid rgba(140,31,22,.35);border-radius:2px;cursor:pointer;
  font-family:inherit;font-size:13px;letter-spacing:.14em}
.leaf button:hover:not(:disabled){border-color:#8c1f16;color:#8c1f16}
.leaf button:disabled{opacity:.35;cursor:default}
.leaf span{min-width:7em;text-align:center}
.scroll-bar{position:absolute;right:10px;top:22px;bottom:52px;width:8px;z-index:5;
  display:none;pointer-events:auto;background:rgba(120,80,40,.2);border-radius:4px}
.scroll.open .scroll-bar.on{display:block}
.scroll-thumb{position:absolute;left:0;right:0;top:0;height:48px;border-radius:4px;cursor:pointer;
  background:rgba(110,62,28,.78)}
.rod{position:absolute;left:-14px;right:-14px;height:16px;z-index:2;
  background:linear-gradient(180deg,#7d4a2c,#3c1a0e 60%,#24100a);
  border:1px solid rgba(216,178,106,.35);border-radius:8px;
  box-shadow:0 6px 18px rgba(0,0,0,.65)}
.rod.top{top:0}
.rod.bottom{bottom:0}
.sc-head{display:flex;align-items:baseline;justify-content:space-between;
  border-bottom:2px solid rgba(140,31,22,.55);padding-bottom:9px;flex:none}
.sc-title{font-family:"STKaiti","KaiTi",serif;font-size:27px;letter-spacing:.32em;
  color:#8c1f16}
.sc-no{font-size:12.5px;letter-spacing:.16em;color:rgba(60,38,26,.62)}
.sc-meta{margin:10px 0 8px;font-size:15px;line-height:1.78;color:#3a2418;flex:none}
.sc-meta p{display:grid;grid-template-columns:52px 1fr;align-items:start}
.sc-meta b{color:#8c1f16;font-weight:600;letter-spacing:.1em}
.sc-meta b:after{content:"："}
.sc-tasks{margin-top:2px;flex:none}
.t-row{display:grid;grid-template-columns:24px 52px 1fr 138px 22px;gap:9px;
  align-items:center;padding:7px 0;font-size:15px;
  border-bottom:1px dashed rgba(120,80,40,.28);
  opacity:0;transform:translateX(-10px);transition:background .35s}
.t-row.in{animation:rowIn .42s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes rowIn{to{opacity:1;transform:translateX(0)}}
.t-row .no{display:flex;align-items:center;justify-content:center;
  width:22px;height:22px;background:#8c1f16;color:#f6e7c8;font-size:12.5px;
  border-radius:2px}
.t-row .owner{color:#8c1f16;letter-spacing:.1em}
.t-row .act{color:#33200f;min-width:0;overflow-wrap:anywhere}
.t-row .out{color:rgba(60,38,26,.72);font-size:13px;text-align:right}
.t-row .mark{text-align:center;color:#8c1f16;font-size:15px;opacity:0;transition:opacity .3s}
.t-row.running{background:rgba(192,57,43,.10)}
.t-row.running .mark{opacity:.5}
.t-row.done .mark{opacity:1}
/* 改单：底色调浅红、字转深红，表示「这条改过」。
   别用删除线——划掉的是改后的新内容，看着像这条作废了 */
.t-row.changed{background:rgba(192,57,43,.16);outline:1px solid rgba(192,57,43,.26)}
.t-row.changed .act{color:#8c1f16}
.t-row.reject{background:rgba(192,57,43,.24);outline:1px solid rgba(140,31,22,.5)}
.t-row.reject .mark{color:#8c1f16;opacity:1}
/* 退回理由：跨整行落在条目下面。只给 ✗ 不说为什么，主公没法判断该不该认 */
.t-row .why{grid-column:1/-1;margin:3px 0 0;font-size:12px;line-height:1.5;
  color:#8c1f16;opacity:.9;letter-spacing:.02em}
.t-row .why.ok{color:#4a7a3a}
.sc-note{margin-top:9px;padding:7px 11px;background:rgba(192,57,43,.10);
  border-left:3px solid #8c1f16;font-size:13.5px;color:#6b2118;line-height:1.7;
  opacity:0;transition:opacity .35s;flex:none}
.sc-note.show{opacity:1}
.sc-foot{margin-top:auto;padding-top:11px;font-size:13px;
  color:rgba(60,38,26,.6);letter-spacing:.06em;border-top:1px solid rgba(120,80,40,.22)}
.sc-foot.static{margin-top:16px}
.sc-deliver{margin-top:2px;flex:none}
.sc-deliver .d-title{font-size:13px;color:#8c1f16;letter-spacing:.2em;margin-bottom:4px}
.d-row{display:grid;grid-template-columns:22px 24px 54px 1fr;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px dashed rgba(120,80,40,.22);font-size:14.5px}
.d-row .d-ck{color:#2e6b45;font-weight:700}
.d-row .d-no{color:rgba(60,38,26,.5);font-size:12.5px}
.d-row .d-own{color:#8c1f16;letter-spacing:.1em}
.d-row .d-out{color:rgba(60,38,26,.8)}

/* ============ 验收 ============ */
.verdict{position:absolute;left:50%;bottom:118px;transform:translateX(-50%) translateY(10px);
  display:flex;gap:16px;z-index:50;opacity:0;pointer-events:none;
  transition:opacity .4s,transform .4s}
.verdict.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.v-btn{padding:11px 30px;background:rgba(18,9,7,.92);color:var(--gold-b);
  border:1px solid rgba(216,178,106,.5);cursor:pointer;
  font-family:inherit;font-size:16px;letter-spacing:.26em;border-radius:2px;
  transition:background .2s,border-color .2s,transform .15s}
.v-btn:hover{background:rgba(192,57,43,.85);border-color:var(--gold-b);
  transform:translateY(-2px)}

/* ============ 结案印章 ============ */
.seal{position:absolute;left:50%;top:46%;z-index:60;width:230px;height:230px;
  display:flex;align-items:center;justify-content:center;
  border:9px solid #c0392b;border-radius:9px;color:#c0392b;
  font-family:"STKaiti","KaiTi",serif;font-size:86px;letter-spacing:.06em;
  opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-12deg);
  text-shadow:0 0 24px rgba(192,57,43,.5);pointer-events:none}
.seal.stamp{animation:stampIt .46s cubic-bezier(.5,0,.8,1) forwards}
@keyframes stampIt{
  0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-12deg)}
  62%{opacity:1;transform:translate(-50%,-50%) scale(.93) rotate(-6deg)}
  100%{opacity:.9;transform:translate(-50%,-50%) scale(1) rotate(-6deg)}
}

/* ============ 问话面板（中堂提问，主公作答） ============ */
.asker{position:absolute;left:520px;top:768px;width:470px;height:116px;z-index:46;
  background:linear-gradient(180deg,rgba(240,229,204,.98),rgba(219,203,168,.96));
  border:1px solid rgba(120,80,40,.5);border-radius:2px;
  box-shadow:0 -10px 34px rgba(0,0,0,.55),0 0 0 5px rgba(88,41,27,.5);
  display:none;flex-direction:column;padding:9px 14px 8px}
.asker.on{display:flex}
.asker-q{font-size:13.5px;color:#6b2118;line-height:1.5;flex:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asker-row{display:flex;gap:10px;margin-top:7px;flex:none}
.asker-row textarea{flex:1;height:46px;resize:none;
  border:1px solid rgba(120,80,40,.35);background:rgba(255,250,235,.55);
  padding:8px 10px;font-family:inherit;font-size:15px;color:var(--ink);outline:none}
.asker-send{width:76px;height:46px;background:linear-gradient(158deg,#c0392b,#8a1d14);
  color:#f8ebcd;border:2px solid rgba(244,223,174,.55);border-radius:5px;
  font-family:"STKaiti","KaiTi",serif;font-size:22px;letter-spacing:.1em;
  cursor:pointer;transition:transform .13s}
.asker-send:hover{transform:translateY(-2px)}
.asker-foot{display:flex;justify-content:flex-end;margin-top:5px;flex:none}
.asker-skip{background:none;border:none;cursor:pointer;padding:2px 4px;
  font-family:inherit;font-size:12px;color:rgba(60,38,26,.55);text-decoration:underline}
.asker-skip:hover{color:#8c1f16}
/* 有选项时只给按钮，不摆输入框——勘验后问主公「再补／结案／作废」是这种 */
.asker-opts{display:none;gap:10px;margin-top:12px;flex:none}
.asker-opt{padding:10px 22px;background:linear-gradient(158deg,#c0392b,#8a1d14);
  color:var(--gold-b);border:1px solid rgba(192,57,43,.5);border-radius:2px;
  font-family:"STKaiti","KaiTi",serif;font-size:19px;letter-spacing:.08em;
  cursor:pointer;transition:transform .13s,background .13s}
.asker-opt:hover{transform:translateY(-2px);background:linear-gradient(158deg,#d0483a,#9c231a)}

/* ============ 工具条 ============ */
.live-tag{padding:6px 12px;border:1px solid rgba(224,82,63,.55);border-radius:2px;
  color:#e0523f;font-size:12.5px;letter-spacing:.12em;background:rgba(192,57,43,.12)}
.toolbar{position:absolute;right:22px;bottom:18px;z-index:75;display:flex;gap:8px;align-items:center}
.toolbar button{padding:6px 13px;background:rgba(18,9,7,.7);color:rgba(240,229,204,.62);
  border:1px solid rgba(216,178,106,.22);border-radius:2px;cursor:pointer;
  font-family:inherit;font-size:12.5px;letter-spacing:.12em;transition:all .2s}
.toolbar button:hover{color:var(--gold-b);border-color:rgba(216,178,106,.6)}
.toolbar select{padding:6px 10px;max-width:280px;
  background:rgba(18,9,7,.7);color:rgba(240,229,204,.82);
  border:1px solid rgba(216,178,106,.22);border-radius:2px;
  font-family:inherit;font-size:12.5px;letter-spacing:.06em;outline:none;cursor:pointer}
.toolbar select:hover{color:var(--gold-b);border-color:rgba(216,178,106,.6)}
.model-pop{position:absolute;right:22px;bottom:56px;z-index:76;width:340px;display:none;
  background:rgba(18,9,7,.94);color:rgba(240,229,204,.9);
  border:1px solid rgba(216,178,106,.4);border-radius:2px;padding:10px 12px 8px;
  box-shadow:0 10px 28px rgba(0,0,0,.45)}
.model-pop.on{display:block}
.model-pop-q{font-size:12.5px;line-height:1.45;color:rgba(240,229,204,.78)}
.model-pop input{width:100%;box-sizing:border-box;margin-top:8px;padding:6px 8px;
  background:rgba(0,0,0,.35);color:rgba(240,229,204,.92);
  border:1px solid rgba(216,178,106,.3);border-radius:2px;
  font-family:inherit;font-size:13px;outline:none}
#modelPopHint{margin-top:8px}
.toolbar button.model-x{padding:2px 8px;letter-spacing:0;font-size:16px;line-height:1}
.model-pop-row{display:flex;gap:8px;margin-top:8px}
.model-pop-err{min-height:1.2em;margin-top:6px;font-size:12px;line-height:1.4;color:#e7b2a8}
.model-note{position:absolute;right:22px;bottom:56px;z-index:76;width:340px;display:none;
  background:rgba(18,9,7,.94);color:#e7b2a8;
  border:1px solid rgba(192,57,43,.55);border-radius:2px;padding:8px 10px;
  font-size:12.5px;line-height:1.45;box-shadow:0 10px 28px rgba(0,0,0,.45)}
.model-note.on{display:block}
.model-note.ok{color:var(--gold-b);border-color:rgba(216,178,106,.55)}

/* 定妆模式：跳过过渡，直接看最终版式 */
.pose-mode *{transition:none!important}
.pose-mode .t-row{opacity:1;transform:none}
</style>
</head>
<body>
<div class="viewport">
  <div class="stage-wrap" id="wrap">
    <div class="stage" id="stage">

      <div class="sky"></div>
      <div class="dust d1"></div>
      <div class="dust d2"></div>
      <div class="floor"></div>
      <div class="spot"></div>
      <div class="carpet"></div>
      <div class="screen"><span class="screen-char">堂</span></div>
      <div class="beam"></div>
      <div class="pillar l"></div>
      <div class="pillar r"></div>

      <div class="courtiers" id="courtiers"></div>

      <div class="zhongtang" id="zhongtang">
        <div class="bubble zt" id="ztBubble"></div>
        <svg viewBox="0 0 160 290" fill="currentColor" aria-hidden="true">
          <rect x="24" y="12" width="112" height="6" rx="3"/>
          <path d="M58 1h44v11H58z"/>
          <rect x="48" y="11" width="64" height="5" rx="2.5"/>
          <ellipse cx="80" cy="30" rx="12" ry="13"/>
          <rect x="72" y="42" width="16" height="9"/>
          <path d="M80 48c-23 0-37 9-42 26l-3 32c-1 7 3 11 10 11h70c7 0 11-4 10-11l-3-32c-5-17-19-26-42-26z"/>
          <rect x="46" y="104" width="68" height="8" rx="2"/>
          <path d="M80 111c-21 0-34 11-37 32l-8 147h90l-8-147c-3-21-16-32-37-32z"/>
          <path d="M80 130v160" stroke="currentColor" stroke-width="2" opacity=".22"/>

      <div class="desk">
        <div class="gavel" id="gavel"><div class="gavel-head"></div></div>

        <div class="ring"></div><div class="ring"></div><div class="ring"></div>

      <div class="composer" id="composer">

          <textarea id="askerIn" placeholder="主公请作答……（Ctrl+Enter 回话）"></textarea>
          <button class="asker-send" id="askerSend">回话</button>
        </div>
        <div class="asker-foot"><button class="asker-skip" id="askerSkip">跳过，直接拆</button></div>
      </div>

        <button class="v-btn" data-v="ok">定稿</button>

      <div class="model-pop" id="modelPop">
        <div class="model-pop-q" id="modelPopQ">接入 API</div>
        <input id="modelPopKey" type="password" placeholder="API Key" autocomplete="off" spellcheck="false" />
        <input id="modelPopUrl" placeholder="接口地址" autocomplete="off" spellcheck="false" />
        <div class="model-pop-q" id="modelPopHint">填 API Key。地址默认 DeepSeek，可以改成别的兼容地址。</div>
        <div class="model-pop-row">
          <button type="button" id="modelPopOk">接入</button>
          <button type="button" id="modelPopCancel">取消</button>

        <select id="modelSel" title="选择模型" style="display:none"></select>
        <button type="button" id="modelDel" class="model-x" style="display:none" title="删除已接入的 API" aria-label="删除已接入的 API">×</button>
        <button id="speedBtn">1×</button>
      </div>

    </div>

</div>

<script>
(function(){
  "use strict";

  var $ = function(s){ return document.querySelector(s); };
  var stage = $('#stage'), wrap = $('#wrap');
  var courtiers = $('#courtiers'), zhongtang = $('#zhongtang');
  var ztBubble = $('#ztBubble');
  var gavel = $('#gavel'), fx = $('#fx'), hud = $('#hud');
  var composer = $('#composer'), req = $('#req'), send = $('#send');
  var scrollEl = $('#scroll'), scrollInner = $('#scrollInner');
  var verdict = $('#verdict'), seal = $('#seal');
  var speed = 1;

  /* ---------- 自适应缩放 ---------- */
  function fit(){
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    wrap.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  /* ---------- 状态机 ---------- */
  var PHASES = ['待升堂','拆单中','附议中','执行中','勘验中','汇总中','待验收','结案'];
  var phaseIdx = 0;
  function buildHud(){
    hud.innerHTML = '';
    PHASES.forEach(function(p, i){
      if(i){ var sep = document.createElement('span'); sep.className = 'sep'; hud.appendChild(sep); }
      var s = document.createElement('span');
      s.className = 'step'; s.textContent = p; s.dataset.i = i;
      hud.appendChild(s);
    });
  }
  function setPhase(i){
    phaseIdx = i;
    Array.prototype.forEach.call(hud.children, function(el){
      if(!el.dataset.i) return;
      var n = +el.dataset.i;
      el.classList.toggle('active', n === i);
      el.classList.toggle('done', n < i);
    });
    /* 惊堂木亮着就是能点：待升堂＝升堂，已结案＝退堂再来一单 */
    if(gavel){
      gavel.classList.toggle('ready', i === 0 || i === 7);
      gavel.title = i === 0 ? '击木升堂' : (i === 7 ? '击木退堂，再议一单' : '议事未毕');
    }
  }
  buildHud();
  setPhase(0);

  /* ---------- 队员 ---------- */
  var MEMBERS = [
    { name:'吏部', x:130,  y:460, s:0.86, color:'#6a9fd8', line:'人已定', duty:'拆开需求，定谁来做、做到哪一步算完。' },
    { name:'户部', x:270,  y:520, s:0.96, color:'#d8b26a', line:'材料够', duty:'管资源、预算、素材和数据，看这一单够不够。' },
    { name:'兵部', x:410,  y:580, s:1.06, color:'#e0523f', line:'异议', line2:'可攻坚', duty:'攻坚。难的那一段由他做出来。' },
    { name:'礼部', x:1374, y:460, s:0.86, color:'#b48ad8', line:'可对外', duty:'管文案和样子，以及对外怎么说。' },
    { name:'工部', x:1234, y:520, s:0.96, color:'#7fb069', line:'能交出', duty:'把各司交来的东西收成一件能打开的成品。' },
    { name:'刑部', x:1094, y:580, s:1.06, color:'#8a8f99', line:'', duty:'只审不做。核成品在不在、合不合格，不合格就退回。' }
  ];
  var SILHOUETTE =
    '<svg viewBox="0 0 96 126" fill="currentColor" aria-hidden="true">' +
      '<path d="M36 6h24v9H36z"/>' +
      '<rect x="20" y="14" width="56" height="5" rx="2.5"/>' +
      '<rect x="32" y="19" width="32" height="4" rx="2"/>' +
      '<ellipse cx="48" cy="30" rx="9.5" ry="10.5"/>' +
      '<path d="M48 40c-14 0-23 7-26 19l-2 9c-1 6 2 9 7 9h42c5 0 8-3 7-9l-2-9c-3-12-12-19-26-19z"/>' +
      '<path d="M48 77c-16 0-26 9-29 24l-3 25h64l-3-25c-3-15-13-24-29-24z"/>' +
      '<rect x="32" y="70" width="32" height="4" rx="2" opacity=".55"/>' +
    '</svg>';

  MEMBERS.forEach(function(m){
    var d = document.createElement('div');
    d.className = 'courtier';
    d.style.left = m.x + 'px';
    d.style.top = m.y + 'px';
    d.style.transform = 'scale(' + m.s + ')';
    d.innerHTML =
      '<div class="lantern"></div>' + SILHOUETTE +
      '<div class="sash" style="background:' + m.color + '"></div>' +
      '<div class="nameplate" style="color:' + m.color + '">' + m.name + '</div>' +
      '<div class="bubble" data-role="bubble"></div>';
    courtiers.appendChild(d);
    m.el = d;
    m.bubble = d.querySelector('[data-role="bubble"]');
    m.nameplate = d.querySelector('.nameplate');
    d.addEventListener('mouseenter', function(){ showDuty(d, m.name, m.duty); });
    d.addEventListener('mouseleave', hideDuty);
  });

  var dutyCard = document.createElement('div');
  dutyCard.className = 'duty';
  dutyCard.innerHTML = '<b></b><p></p>';
  stage.appendChild(dutyCard);

  function showDuty(el, name, text){
    dutyCard.querySelector('b').textContent = name;
    dutyCard.querySelector('p').textContent = text;
    dutyCard.classList.add('on');
    var stageRect = stage.getBoundingClientRect();
    var rect = el.getBoundingClientRect();
    var scale = stageRect.width / stage.offsetWidth || 1;
    var cx = (rect.left + rect.width / 2 - stageRect.left) / scale;
    var top = (rect.top - stageRect.top) / scale;
    cx = Math.max(110, Math.min(1490, cx));
    dutyCard.style.left = cx + 'px';
    dutyCard.style.top = Math.max(78, top - 6) + 'px';
    dutyCard.style.transform = 'translate(-50%, -100%)';
  }
  function hideDuty(){ dutyCard.classList.remove('on'); }

  zhongtang.addEventListener('mouseenter', function(){
    showDuty(zhongtang, '中堂', '拆单、派司、收附议、汇总。他自己不干活。');
  });
  zhongtang.addEventListener('mouseleave', hideDuty);

  /**
   * 给某个司设状态。状态会驱动动作，不只是换个字：
   *   idle     待命
   *   thinking 思考 —— 身子轻晃、灯闪烁
   *   blocked  卡壳 —— 名牌发红、身子抖动
   *   done     交活 —— 名牌变亮
   */
  function setState(m, state, label){
    m.el.dataset.state = state;
    m.nameplate.textContent = label ? (m.name + '·' + label) : m.name;
  }

  function resetStates(){
    MEMBERS.forEach(function(m){ setState(m, 'idle'); });
  }

  function byName(n){
    for(var i=0;i<MEMBERS.length;i++){ if(MEMBERS[i].name === n) return MEMBERS[i]; }
    return null;
  }

  /* ---------- 工具 ---------- */
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms / speed); }); }

  var typeTimer = null;
  function say(el, txt, keep){
    clearInterval(typeTimer);
    el.classList.remove('hide');
    el.classList.add('show');
    el.textContent = '';
    var i = 0, step = Math.max(1, Math.round(txt.length / 34));
    typeTimer = setInterval(function(){
      i += step;
      el.textContent = txt.slice(0, i);
      if(i >= txt.length){ clearInterval(typeTimer); el.textContent = txt; }
    }, 32 / speed);
    if(!keep){ /* 由调用方控制隐藏 */ }
  }
  function hideBubble(el){
    el.classList.remove('show');
    el.classList.add('hide');
  }
  function shout(m, text, dissent){
    m.bubble.textContent = m.name + '　' + text;
    m.bubble.classList.toggle('dissent', !!dissent);
    m.bubble.classList.remove('show','hide');
    void m.bubble.offsetWidth;
    m.bubble.classList.add('show');
    setTimeout(function(){ hideBubble(m.bubble); }, 1500 / speed);
  }

  /* ---------- 音效（纯合成，无外部素材） ---------- */
  var AC = null;
  function ac(){
    if(!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      if(!C) return null;
      AC = new C();
    }
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }
  function sfxSlam(){
    var c = null;
    try{ c = ac(); }catch(e){ return; }
    if(!c) return;
    var t = c.currentTime;
    var len = Math.floor(c.sampleRate * 0.13);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<len;i++){ var p = i/len; d[i] = (Math.random()*2-1) * Math.pow(1-p, 5); }
    var src = c.createBufferSource(); src.buffer = buf;
    var bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 950; bp.Q.value = 1.15;
    var g = c.createGain(); g.gain.value = 0.5;
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t);

    var o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(145, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.14);
    var g2 = c.createGain();
    g2.gain.setValueAtTime(0.62, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g2); g2.connect(c.destination);
    o.start(t); o.stop(t + 0.32);

    var o2 = c.createOscillator(); o2.type = 'triangle';
    o2.frequency.setValueAtTime(230, t + 0.015);
    var g3 = c.createGain();
    g3.gain.setValueAtTime(0.07, t);
    g3.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
    o2.connect(g3); g3.connect(c.destination);
    o2.start(t + 0.015); o2.stop(t + 0.58);
  }
  /** 退堂：木头砸下之后拖一声低沉的余韵，跟升堂那记干脆的撞击分开。
      同一块木头，砸下去是「起」，再砸一下是「收」——声音得听得出区别。 */
  function sfxRecess(){
    var c = null;
    try{ c = ac(); }catch(e){ return; }
    if(!c) return;
    var t = c.currentTime;

    /* 木击，比升堂闷一点 */
    var len = Math.floor(c.sampleRate * 0.16);
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for(var i=0;i<len;i++){ var p = i/len; d[i] = (Math.random()*2-1) * Math.pow(1-p, 4); }
    var src = c.createBufferSource(); src.buffer = buf;
    var bp = c.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 620; bp.Q.value = 0.9;
    var g = c.createGain(); g.gain.value = 0.42;
    src.connect(bp); bp.connect(g); g.connect(c.destination);
    src.start(t);

    /* 低沉的余韵，长尾 */
    var o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(78, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 1.1);
    var g2 = c.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.30, t + 0.04);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 1.3);
    o.connect(g2); g2.connect(c.destination);
    o.start(t); o.stop(t + 1.35);

    /* 一层更闷的垫音，做出堂上回声 */
    var o2 = c.createOscillator(); o2.type = 'triangle';
    o2.frequency.setValueAtTime(52, t);
    var g3 = c.createGain();
    g3.gain.setValueAtTime(0.10, t + 0.05);
    g3.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
    o2.connect(g3); g3.connect(c.destination);
    o2.start(t + 0.05); o2.stop(t + 1.65);
  }

  function sfxSeal(){    var c = null;
    try{ c = ac(); }catch(e){ return; }
    if(!c) return;
    var t = c.currentTime;
    var o = c.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(80, t + 0.18);
    var g = c.createGain();
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + 0.38);
  }

  /* ---------- 升堂单数据 ---------- */
  var TASKS = [
    { id:1, owner:'吏部', act:'拆解需求，写成可勾选的清单', out:'任务表 v1' },
    { id:2, owner:'户部', act:'盘点资源、预算与素材',       out:'资源清单' },

    { id:5, owner:'礼部', act:'写对外说明与演示文案',       out:'说明文档' }
  ];

  /* ============================================================
     真实模式
     ------------------------------------------------------------
     由 stage/server.py 托管时（http 协议）：
       拆单 → 附议 → 执行 → 勘验 → 汇总，五段都走真模型。
     直接双击打开（file 协议）时，用上面写死的 TASKS 演一遍，
     附议的异议、勘验的退回、汇总的文案都是演的。
     ============================================================ */
  var LIVE = location.protocol === 'http:' || location.protocol === 'https:';
  var LIVE_TASKS = null;
  var LIVE_ORDER = null;
  /* 附议结果：结果卷轴要如实标注「有没有谈拢」 */
  var ATTEST = null;
  var EXEC = null;
  var SELECTED_MODEL = '';
  var SELECTED_PROFILE = '';
  /* 端点这次返回的名单。modelListOk 为假表示没取到，不能拿空名单去否决。 */
  var modelIds = [];
  var modelListOk = false;
  var cloudLinks = [];
  /* 用户动过选择器之后，刷新名单不能再把选中项改回启动模型。 */
  var modelTouched = false;
  var modelLoadToken = 0;
  var cloudKind = 'api';
  var DEEPSEEK_BASE = 'https://api.deepseek.com/v1';

  /* ---------- 模型选择器 ---------- */
  function parseModelValue(value){
    if(!value || value === '__add__' || value === '__err__') return {profile:'', model:''};
    var cut = value.indexOf('::');
    if(cut < 0) return {profile:'', model:value};
    return {profile: value.slice(0, cut), model: value.slice(cut + 2)};
  }
  function modelValue(profile, model){
    if(!model) return '';
    if(profile === 'api' || profile === 'plan') return profile + '::' + model;
    return 'local::' + model;
  }
  function applySelection(value){
    var parsed = parseModelValue(value);
    SELECTED_PROFILE = parsed.profile;
    SELECTED_MODEL = parsed.model;
    var sel = document.getElementById('modelSel');
    if(sel) sel.title = SELECTED_MODEL || '选择模型';
    syncModelDel();
  }

  function showModelNote(text, ok){
    var note = document.getElementById('modelNote');
    if(!note) return;
    note.textContent = text;
    note.classList.toggle('ok', !!ok);
    note.classList.add('on');
  }
  function clearModelNote(){
    var note = document.getElementById('modelNote');
    if(!note) return;
    note.textContent = '';
    note.classList.remove('on');
    note.classList.remove('ok');
  }
  function syncModelDel(){
    var btn = document.getElementById('modelDel');
    if(!btn) return;
    btn.style.display = cloudLinks.length ? '' : 'none';
  }

  /**
   * 拉可用模型列表，填进选择器。
   * 传入 preferred 时，重建后选中它（空字符串表示「跟随启动参数」）。
   */
  function loadModels(preferred){
    var hasPreferred = arguments.length > 0;
    var token = ++modelLoadToken;
    var sel = document.getElementById('modelSel');
    if(!sel) return;
    if(!LIVE){ sel.style.display = 'none'; return; }
    sel.style.display = '';

    var fill = function(serverIds, current, listOk, errText, clouds){
      if(token !== modelLoadToken) return;
      modelIds = serverIds.slice();
      modelListOk = listOk;
      cloudLinks = clouds || [];

      var want;
      if(hasPreferred) want = preferred || '';
      else if(modelTouched) want = modelValue(SELECTED_PROFILE, SELECTED_MODEL);
      else want = (current && serverIds.indexOf(current) >= 0) ? ('local::' + current) : '';

      sel.innerHTML = '';

      var localGroup = document.createElement('optgroup');
      localGroup.label = '本机';
      var def = document.createElement('option');
      def.value = ''; def.textContent = '跟随启动参数';
      localGroup.appendChild(def);

      if(errText){
        var e = document.createElement('option');
        e.value = '__err__'; e.textContent = errText; e.disabled = true;
        localGroup.appendChild(e);
      }

      serverIds.forEach(function(id){
        var o = document.createElement('option');
        o.value = 'local::' + id;
        o.textContent = id;
        localGroup.appendChild(o);
      });
      sel.appendChild(localGroup);

      cloudLinks.forEach(function(link){
        var models = link.models || [];
        if(!models.length) return;
        var group = document.createElement('optgroup');
        group.label = link.label || link.id;
        models.forEach(function(id){
          var o = document.createElement('option');
          o.value = link.id + '::' + id;
          o.textContent = id;
          group.appendChild(o);
        });
        sel.appendChild(group);
      });

      var add = document.createElement('option');
      add.value = '__add__'; add.textContent = '＋ 接入 API…';
      sel.appendChild(add);

      var hasWant = false;
      for(var i = 0; i < sel.options.length; i++){
        if(sel.options[i].value === want && !sel.options[i].disabled){ hasWant = true; break; }
      }
      sel.value = hasWant ? want : '';
      applySelection(sel.value);
    };

    fetch('/api/models').then(function(r){ return r.json(); }).then(function(data){
      var ids = data.models || [];
      var listOk = !data.error;
      var errText = listOk ? (ids.length ? '' : '无可用模型') : '模型列表不可用';
      fill(ids, data.current || '', listOk, errText, data.clouds || []);
    }).catch(function(){
      fill([], '', false, '模型列表不可用', []);
    });
  }

  function openModelPop(){
    var pop = document.getElementById('modelPop');
    var input = document.getElementById('modelPopKey');
    var url = document.getElementById('modelPopUrl');
    var err = document.getElementById('modelPopErr');
    if(!pop || !input) return;
    clearModelNote();
    cloudKind = 'api';
    if(url && !url.value.trim()) url.value = DEEPSEEK_BASE;
    err.textContent = '';
    input.value = '';
    pop.classList.add('on');

  function closeModelPop(){
    var pop = document.getElementById('modelPop');
    var input = document.getElementById('modelPopKey');

  function submitModelAdd(){
    var input = document.getElementById('modelPopKey');
    var url = document.getElementById('modelPopUrl');
    var err = document.getElementById('modelPopErr');
    var ok = document.getElementById('modelPopOk');
    var key = (input.value || '').trim();
    if(!key){ err.textContent = '请填写 API Key'; return; }
    err.textContent = '';
    ok.disabled = true;
    ok.textContent = '接入中';
    fetch('/api/cloud', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        kind: cloudKind,
        api_key: key,
        base_url: url ? url.value.trim() : ''
      })
    }).then(function(r){
      return r.json().then(function(data){ return {status: r.status, data: data}; });
    }).then(function(res){
      ok.disabled = false;
      ok.textContent = '接入';
      if(!res.data || !res.data.ok){
        err.textContent = (res.data && res.data.error) || '没接上';
        return;
      }
      var models = res.data.models || [];
      var first = models[0] || '';
      modelTouched = true;
      closeModelPop();
      loadModels(first ? (res.data.kind + '::' + first) : '');
      showModelNote('已接入 ' + models.length + ' 个' + (res.data.label || '') + '模型', true);
    }).catch(function(){
      ok.disabled = false;
      ok.textContent = '接入';
      err.textContent = '连不上演出服务';
    });
  }

  /** 调后端拆单，边收事件边回报。返回 {order} 或 {error}。 */
  function fetchOrder(requirement, onEvent){
    return new Promise(function(resolve){
      var url = '/api/order?requirement=' + encodeURIComponent(requirement);
      if(SELECTED_MODEL){ url += '&model=' + encodeURIComponent(SELECTED_MODEL); }
      if(SELECTED_PROFILE === 'api' || SELECTED_PROFILE === 'plan'){
        url += '&profile=' + encodeURIComponent(SELECTED_PROFILE);
      }
      var es = new EventSource(url);
      var done = false;

      es.onmessage = function(ev){
        var data;
        try { data = JSON.parse(ev.data); } catch(e){ return; }
        if(onEvent){ onEvent(data); }
        if(data.type === 'order/final'){
          done = true;
          es.close();
          resolve(data);
        }
      };
      es.onerror = function(){
        if(done) return;
        es.close();
        resolve({ error: '连不上演出服务（stage/server.py 是否在跑？）' });
      };
    });
  }

  /** POST 一条 SSE 流，边收边报。收满 finalType 那条事件就作为结果返回。 */
  function postStream(path, body, finalType, onEvent){
    return fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(res){
      if(!res.ok || !res.body){
        return res.text().then(function(t){ return { error: t || ('服务返回 ' + res.status) }; });
      }
      var reader = res.body.getReader();
      var dec = new TextDecoder();
      var buf = '';
      var last = null;
      function take(block){
        block.split('\n').forEach(function(line){
          if(line.indexOf('data:') !== 0) return;
          var data;
          try { data = JSON.parse(line.slice(5).trim()); } catch(e){ return; }
          if(onEvent) onEvent(data);
          if(data.type === finalType) last = data;
        });
      }
      function pump(){
        return reader.read().then(function(r){
          if(r.done){
            if(buf) take(buf);
            return last || { error: '没有回音' };
          }
          buf += dec.decode(r.value, {stream: true});
          var parts = buf.split('\n\n');
          buf = parts.pop();
          parts.forEach(take);
          return pump();
        });
      }
      return pump();
    }).catch(function(){
      return { error: '连不上演出服务（stage/server.py 是否在跑？）' };
    });
  }

  /** 每一单都要带上的模型选择。 */
  function liveBody(){
    return {
      model: SELECTED_MODEL || '',
      profile: (SELECTED_PROFILE === 'api' || SELECTED_PROFILE === 'plan') ? SELECTED_PROFILE : ''
    };
  }

  /** 附议定了之后，等各司把文件写进案卷。attest 是附议结果，汇总要用。 */
  function fetchExecute(order, requirement, attest, onEvent){
    var body = liveBody();
    body.order = order;
    body.requirement = requirement;
    if(attest) body.attest = attest;
    return postStream('/api/execute', body, 'execute/final', onEvent);
  }

  /** 六司真表态。返回 {order, passed, escalate}——order 是改过之后的单子。 */
  function fetchAttest(order, onEvent){
    var body = liveBody();
    body.order = order;
    return postStream('/api/attest', body, 'attest/final', onEvent);
  }

  var orderNo = '';

  /** 模型给的字直接进 innerHTML 会破版式，一律先转义。 */
  function esc(text){
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /**
   * 改单必须同时写回单子本身。
   * 只改 DOM 不改 LIVE_ORDER，执行时发出去还是原单——画面上写着「拆为两期」，
   * 实际做的还是原来那条，等于朝堂在骗主公。
   */
  function amendOrder(index, act, out){
    if(LIVE_ORDER && LIVE_ORDER['任务'] && LIVE_ORDER['任务'][index]){
      LIVE_ORDER['任务'][index]['做什么'] = act;
      LIVE_ORDER['任务'][index]['交付物'] = out;
    }
    if(LIVE_TASKS && LIVE_TASKS[index]){
      LIVE_TASKS[index].act = act;
      LIVE_TASKS[index].out = out;
    }
  }

  /** 数一数这一单用到了几个不同的司（用于约束行）。 */
  function distinctDepts(list){
    var seen = {};
    list.forEach(function(t){ seen[t.owner] = 1; });
    return Object.keys(seen).length;
  }

  function orderHTML(text, overrideGoal){
    var list = LIVE_TASKS || TASKS;
    var raw = overrideGoal || text;
    var goal = raw.length > 52 ? raw.slice(0, 52) + '…' : raw;
    var rows = list.map(function(t){

        '<span class="out">→ ' + t.out + '</span>' +
        '<span class="mark">✓</span>' +
      '</div>';
    }).join('');
    return '<div class="sc-head">' +
        '<span class="sc-title">卷 宗</span>' +

        '<p><b>约束</b>本单开 ' + distinctDepts(list) + ' 司（刑部只审不做）／ 闸门 150k　70% 冻结范围</p>' +

  function resultHTML(){
    var list = LIVE_TASKS || TASKS;
    /* 交付清单的勾要用**勘验结果**定，不能用执行结果。
       执行只说明「交上来了」，勘验才说明「这东西算不算交了这活」。
       用错了会出现「清单打勾、勘验却说有退回」的自相矛盾。 */
    var verdicts = (EXEC && EXEC.inspection && EXEC.inspection.verdicts) || null;
    var rows = list.map(function(t, i){
      var mark = '✓';
      if(verdicts && verdicts[i]) mark = verdicts[i].ok ? '✓' : '✗';
      else if(EXEC && EXEC.checks && EXEC.checks[i] && !EXEC.checks[i].ok) mark = '✗';
      return '<div class="d-row">' +
        '<span class="d-ck">' + mark + '</span>' +
        '<span class="d-no">' + t.id + '</span>' +
        '<span class="d-own">' + t.owner + '</span>' +
        '<span class="d-out">' + t.out + '</span>' +
      '</div>';
    }).join('');
    var execLine;
    var checkLine;
    var nextLine;
    if(EXEC && EXEC.inspection){
      var insp2 = EXEC.inspection;
      var vs = insp2.verdicts || [];
      var okCount = vs.filter(function(v){ return v.ok; }).length;
      var retriedOk = vs.filter(function(v){ return v.retried && v.ok; }).length;
      var pathText = String(EXEC.productPath).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      var caseText = String(EXEC.caseDir || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
      execLine = '<p><b>成品</b><a href="' + EXEC.productUrl + '" target="_blank">' + pathText + '</a></p>';
      checkLine = '<p><b>勘验</b>刑部逐条核内容：' + okCount + ' / ' + vs.length + ' 项通过'
        + (retriedOk ? '，其中 ' + retriedOk + ' 项补交后通过' : '')
        + (insp2.passed ? '，全过' : '，有退回') + '</p>';
      nextLine = '<p><b>案卷</b>' + caseText + '</p>';
    }else if(EXEC && EXEC.productPath){
      var passed = (EXEC.checks || []).filter(function(c){ return c.ok; }).length;
      var total = (EXEC.checks || []).length;
      var pathText2 = String(EXEC.productPath).replace(/&/g, '&amp;').replace(/</g, '&lt;');
      var caseText2 = String(EXEC.caseDir || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
      execLine = '<p><b>成品</b><a href="' + EXEC.productUrl + '" target="_blank">' + pathText2 + '</a></p>';
      checkLine = '<p><b>勘验</b>刑部只核文件：' + passed + ' / ' + total + ' 项落盘' + (EXEC.ok ? '，全过' : '，有退回') + '</p>';
      nextLine = '<p><b>案卷</b>' + caseText2 + '</p>';
    }else{
      var fixNo = Math.min(4, list.length);
      execLine = '<p><b>执行</b>演示逻辑，没有写出文件</p>';
      checkLine = '<p><b>勘验</b>演示逻辑：' + list.length + ' 项全过，其中第 ' + fixNo + ' 项经补证后通过</p>';
      nextLine = '<p><b>待批</b>下一场若走真模型，文件会进案卷夹。</p>';
    }
    var attestLine = '';
    if(ATTEST){
      var rounds = ATTEST.rounds || 1;
      var dissents = (ATTEST.stances || []).filter(function(s){ return s.verdict === '异议'; }).length;
      if(ATTEST.escalate){
        attestLine = '<p><b>附议</b>' + rounds + ' 轮未达成共识（' + dissents + ' 处异议），已按最后一版单子执行，请主公追认</p>';
      }else if(ATTEST.amendments && ATTEST.amendments.length){
        attestLine = '<p><b>附议</b>' + rounds + ' 轮达成共识，依异议改单 ' + ATTEST.amendments.length + ' 处</p>';
      }else{
        attestLine = '<p><b>附议</b>' + rounds + ' 轮全附议，无改单</p>';
      }
    }
    var summaryLine = '';
    if(EXEC && EXEC.summary){
      var sm = EXEC.summary;
      if(sm.verdict) summaryLine += '<p><b>结语</b>' + esc(sm.verdict) + '</p>';
      if(sm.risks && sm.risks.length){
        summaryLine += '<p><b>风险</b>' + sm.risks.map(esc).join('；') + '</p>';
      }
      if(sm.undone && sm.undone.length){
        summaryLine += '<p><b>未做</b>' + sm.undone.map(esc).join('；') + '</p>';
      }
      if(sm.path) summaryLine += '<p><b>结案</b>' + esc(sm.path) + '</p>';
    }
    return '<div class="sc-head">' +
        '<span class="sc-title">升 堂 结 果</span>' +
        '<span class="sc-no">编号 ' + orderNo + '</span>' +
      '</div>' +
      '<div class="sc-meta">' +
        '<p><b>拆单</b>已达成（' + list.length + ' 条任务' + (LIVE ? '，真模型生成' : '') + '）</p>' +
        attestLine +
        summaryLine +
        execLine + checkLine + nextLine +
      '</div>' +
      '<div class="sc-deliver">' +
        '<div class="d-title">交 付 清 单</div>' + rows +
      '</div>' +
      '<div class="sc-foot static">主公请裁：定稿 ／ 退回（改一句需求重下一单）／ 否决</div>';
  }

  async function openScroll(html, hold){
    scrollInner.innerHTML = html;
    /* 中堂侍立到卷轴右侧：不挡单子，也不挡六司 */
    zhongtang.classList.add('aside');
    scrollEl.classList.add('open');
    await wait(hold || 620);
  }
  async function closeScroll(home){
    scrollEl.classList.remove('open');
    if(home){ zhongtang.classList.remove('aside'); }
    await wait(620);
  }

  /* 升堂簿的每一页。演的时候先记账，结案后才能翻，免得把正在改的那一页换掉。 */
  var book = [];
  var bookAt = 0;
  var bookReady = false;

  function rememberPage(title){
    var html = scrollInner.innerHTML;
    if(book.length && book[book.length - 1].html === html) return;
    book.push({ title: title, html: html });
    bookAt = book.length - 1;
    renderLeaf();
  }
  function showBook(i){
    if(!bookReady || i < 0 || i >= book.length || i === bookAt) return;
    bookAt = i;
    scrollInner.innerHTML = book[i].html;
    renderLeaf();
  }
  function renderLeaf(){
    var leaf = document.getElementById('leaf');
    if(!leaf) return;
    if(!bookReady || book.length < 2){
      leaf.classList.remove('on');
      scrollEl.classList.remove('has-leaf');
      return;
    }
    leaf.classList.add('on');
    scrollEl.classList.add('has-leaf');
    document.getElementById('leafPrev').disabled = bookAt <= 0;
    document.getElementById('leafNext').disabled = bookAt >= book.length - 1;
    document.getElementById('leafNo').textContent = book[bookAt].title + '  ' + (bookAt + 1) + '/' + book.length;
  }

  var scrollBar = document.createElement('div');
  scrollBar.className = 'scroll-bar';
  scrollBar.innerHTML = '<div class="scroll-thumb"></div>';
  scrollEl.appendChild(scrollBar);
  var scrollThumb = scrollBar.firstChild;
  function syncScrollBar(){
    var max = scrollInner.scrollHeight - scrollInner.clientHeight;
    if(max <= 2){ scrollBar.classList.remove('on'); return; }
    scrollBar.classList.add('on');
    var track = scrollBar.clientHeight;
    var h = Math.max(36, track * scrollInner.clientHeight / scrollInner.scrollHeight);
    var top = (scrollInner.scrollTop / max) * (track - h);
    scrollThumb.style.height = h + 'px';
    scrollThumb.style.top = top + 'px';
  }
  scrollInner.addEventListener('scroll', syncScrollBar);
  new MutationObserver(syncScrollBar).observe(scrollInner, {childList:true, subtree:true});
  var scrollDrag = null;
  scrollThumb.addEventListener('pointerdown', function(e){
    scrollDrag = { y: e.clientY, top: scrollInner.scrollTop };
    scrollThumb.setPointerCapture(e.pointerId);
  });
  scrollThumb.addEventListener('pointermove', function(e){
    if(!scrollDrag) return;
    var max = scrollInner.scrollHeight - scrollInner.clientHeight;
    var track = scrollBar.clientHeight - scrollThumb.offsetHeight;
    if(track <= 0) return;
    var scale = stage.getBoundingClientRect().height / stage.offsetHeight || 1;
    scrollInner.scrollTop = scrollDrag.top + ((e.clientY - scrollDrag.y) / scale) * (max / track);
  });
  scrollThumb.addEventListener('pointerup', function(){ scrollDrag = null; });
  scrollThumb.addEventListener('pointercancel', function(){ scrollDrag = null; });

  /* ---------- 主流程 ---------- */
  var busy = false;
  /* 上一单的需求。主公点「退回」时要把它放回奏折，让他改一句重下。 */
  var lastRequirement = '';

  function newOrderNo(){
    var d = new Date();
    var p = function(n){ return (n < 10 ? '0' : '') + n; };
    return '' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-01';
  }

  /**
   * 退堂：一场议事完了，清场再来。
   *
   * 惊堂木第二次落下，语义从「起」变成「收」——所以声音更沉、余韵更长。
   * 不刷新页面：刷新会把升堂簿一起带走，而且白屏一下很难看。
   */
  async function recess(){
    if(busy) return;
    busy = true;
    verdict.classList.remove('show');
    askHide();
    hideBubble(ztBubble);

    /* 1 惊堂木再落一次 */
    gavel.classList.remove('slam');
    void gavel.offsetWidth;
    gavel.classList.add('raise');
    await wait(170);
    gavel.classList.remove('raise');
    gavel.classList.add('slam');
    sfxRecess();
    stage.classList.add('shake');
    setTimeout(function(){ stage.classList.remove('shake'); }, 520 / speed);
    setPhase(0);
    await wait(260);

    /* 2 中堂压场，六司应一声「喏」 */
    zhongtang.classList.remove('aside');
    zhongtang.classList.add('stand');
    say(ztBubble, '肃静——');
    await wait(820);
    MEMBERS.forEach(function(m, i){
      setTimeout(function(){ shout(m, '喏'); }, i * 58 / speed);
    });
    await wait(1000);
    hideBubble(ztBubble);

    /* 3 灯从外向内灭——跟升堂时由内向外点亮正好反过来 */
    var OUT = ['礼部', '吏部', '工部', '户部', '刑部', '兵部'];
    for(var i=0;i<OUT.length;i++){
      var who = byName(OUT[i]);
      if(who){
        who.el.classList.remove('lit');
        setState(who, 'idle');
        hideBubble(who.bubble);
      }
      await wait(90);
    }
    await wait(240);

    /* 4 收卷 */
    await closeScroll(true);

    /* 5 清场。不刷新就得手动抹干净——漏一样，下一场就带着上一场的残留 */
    EXEC = null;
    ATTEST = null;
    LIVE_ORDER = null;
    LIVE_TASKS = null;
    book = [];
    bookAt = 0;
    bookReady = false;
    renderLeaf();
    seal.classList.remove('stamp');
    orderNo = '';
    /* 中堂也退回侧廊，下一场才好重新入场 */
    zhongtang.classList.remove('enter', 'stand', 'aside');
    resetStates();
    setPhase(0);

    /* 6 摊开奏折。上次的需求留着，全选方便改一句重下 */
    if(!req.value && lastRequirement) req.value = lastRequirement;
    composer.classList.remove('fold');
    send.disabled = false;
    busy = false;
    req.focus();
    req.select();
  }

  async function startCourt(){
    var text = req.value.trim();
    if(!text){
      composer.classList.remove('err');
      void composer.offsetWidth;
      composer.classList.add('err');
      req.focus();
      return;
    }
    if(LIVE && (SELECTED_PROFILE === 'api' || SELECTED_PROFILE === 'plan')){
      var cloud = null;
      cloudLinks.forEach(function(item){ if(item.id === SELECTED_PROFILE) cloud = item; });
      if(!cloud || !SELECTED_MODEL || (cloud.models || []).indexOf(SELECTED_MODEL) < 0){
        showModelNote('这一路云端没有模型「' + (SELECTED_MODEL || '') + '」。请重接，或点 × 删除。');
        return;
      }
    }else if(LIVE && SELECTED_MODEL && modelListOk && modelIds.indexOf(SELECTED_MODEL) < 0){
      showModelNote('端点没有模型「' + SELECTED_MODEL + '」。请换一个。');
      return;
    }
    clearModelNote();
    if(busy) return;
    busy = true;
    send.disabled = true;
    lastRequirement = text;
    orderNo = newOrderNo();
    resetStates();
    ATTEST = null;

    /* 0 收起奏折 */
    composer.classList.add('fold');
    await wait(180);

    /* 1 惊堂木：抬 → 落 → 震 */
    gavel.classList.remove('slam');
    void gavel.offsetWidth;   /* 让动画能重放，否则第二次升堂木头不动 */
    gavel.classList.add('raise');
    await wait(170);
    gavel.classList.remove('raise');
    gavel.classList.add('slam');
    sfxSlam();
    stage.classList.add('shake');
    fx.classList.add('go');
    setTimeout(function(){ stage.classList.remove('shake'); }, 560 / speed);
    setTimeout(function(){ fx.classList.remove('go'); }, 900 / speed);
    setPhase(1);
    await wait(230);

    /* 2 中堂入场，先压场：「肃静」。这时灯还没点，众人还没出声 */
    zhongtang.classList.add('enter');
    await wait(1050);
    zhongtang.classList.add('stand');
    await wait(120);
    say(ztBubble, '肃静——');
    await wait(1100);
    hideBubble(ztBubble);

    /* 3 六席依次亮灯 */
    for(var i=0;i<MEMBERS.length;i++){
      MEMBERS[i].el.classList.add('lit');
      await wait(85);
    }
    await wait(120);

    /* 4 齐呼「升堂」 */
    MEMBERS.forEach(function(m, i){
      setTimeout(function(){ shout(m, '升堂'); }, i * 78 / speed);
    });
    await wait(1150);

    say(ztBubble, '禀主公，此单臣已过目。');
    await wait(1350);

    if(LIVE){
      /* ---- 真实模式：拆单走真模型，事件边收边报 ---- */
      say(ztBubble, '主公稍候，臣这就拆单。');

      var res = await fetchOrder(text, function(ev){
        if(ev.type === 'order/question'){
          /* 中堂问话：停下来等主公，答完再拆 */
          say(ztBubble, ev.question);
          askShow(ev.sid, ev.question);
        }else if(ev.type === 'order/attempt'){
          askHide();   /* 拆单一动就收面板，别留个空框在那儿 */
          say(ztBubble, '第 ' + ev.index + ' 轮拆单……');
        }else if(ev.type === 'order/rejected'){
          say(ztBubble, '第 ' + ev.index + ' 轮不合格：' + (ev.problems || []).join('；'));
        }else if(ev.type === 'order/accepted'){
          say(ztBubble, '第 ' + ev.index + ' 轮过检，请主公过目。');
        }
      });

      if(res.error){
        /* 终局兜底：如实请示，绝不拿坏单子往下演 */
        askHide();
        say(ztBubble, '臣拆不出来——' + res.error + '　请主公示下。');
        setPhase(0);
        composer.classList.remove('fold');
        send.disabled = false;
        busy = false;
        return;
      }

      LIVE_ORDER = res.order;
      LIVE_TASKS = (res.order['任务'] || []).map(function(t, i){
        return { id: i + 1, owner: t['司'], act: t['做什么'], out: t['交付物'] };
      });
      setPhase(1);
      await openScroll(orderHTML(text, res.order['目标']));
    }else{
      /* ---- 演示模式：用写死的任务表演一遍 ---- */
      say(ztBubble, '臣按「既能看、也能跑」拆，本单开五司，刑部只审不做。');
      await wait(1500);
      setPhase(1);
      await openScroll(orderHTML(text));
    }
    hideBubble(ztBubble);

    var rows = scrollInner.querySelectorAll('.t-row');
    for(var k=0;k<rows.length;k++){
      rows[k].classList.add('in');
      await wait(165);
    }
    await wait(700);
    rememberPage('升堂单');

    /* 6 附议：真模式下六司真表态、有异议真改单；演示模式仍按写死的节拍演一遍 */
    setPhase(2);
    var fixIdx = Math.min(3, rows.length - 1);
    var amendNote = [];

    if(LIVE && LIVE_ORDER){
      say(ztBubble, '臣请六司表态。');
      var attested = await fetchAttest(LIVE_ORDER, function(ev){
        var who = ev.dept ? byName(ev.dept) : null;

        if(ev.type === 'attest/round'){
          if(ev.round > 1) say(ztBubble, '第 ' + ev.round + ' 轮附议。');
        }else if(ev.type === 'attest/thinking'){
          if(who) setState(who, 'thinking', '思忖');
        }else if(ev.type === 'attest/stance'){
          if(!who) return;
          if(ev.verdict === '异议'){
            shout(who, '异议', true);
            setState(who, 'blocked', '异议');
            say(ztBubble, ev.dept + '有异议：' + (ev.reason || '这一条办不了'));
          }else{
            shout(who, '附议');
            setState(who, 'done', '附议');
          }
        }else if(ev.type === 'attest/amended'){
          /* 中堂真改单：屏幕和单子一起改，缺一样都是骗人 */
          say(ztBubble, (ev.by || '中堂') + '说得是。第 ' + (ev.index + 1) + ' 条改为「' + ev.action + '」。');
          var row = rows[ev.index];
          if(row){
            row.classList.add('changed');
            var actEl = row.querySelector('.act');
            var outEl = row.querySelector('.out');
            if(actEl) actEl.textContent = ev.action;
            if(outEl) outEl.textContent = '→ ' + ev.deliverable;
          }
          amendOrder(ev.index, ev.action, ev.deliverable);
          amendNote.push('第 ' + (ev.index + 1) + ' 条依「' + ev.by + '」异议改为：' + ev.action);
          if(who) setState(who, 'done', '已改单');
        }else if(ev.type === 'attest/skip'){
          if(who) setState(who, 'idle', '未表态');
        }
      });

      if(attested && attested.error){
        say(ztBubble, '附议没走完——' + attested.error + '　按当前单子往下走。');
        await wait(1200);
      }else if(attested){
        if(attested.order) LIVE_ORDER = attested.order;
        if(attested.order && attested.order['任务']){
          LIVE_TASKS = attested.order['任务'].map(function(t, i){
            return { id: i + 1, owner: t['司'], act: t['做什么'], out: t['交付物'] };
          });
        }
        ATTEST = attested;
        if(amendNote.length){
          var note = scrollInner.querySelector('#scNote');
          if(note){
            note.textContent = '改单记录：' + amendNote.join('；');
            note.classList.add('show');
          }
          rememberPage('改后');
        }
        if(attested.escalate){
          say(ztBubble, '两轮没谈拢，臣不敢擅专。先按最后一版办，请主公事后追认。');
          await wait(1600);
        }
      }
      hideBubble(ztBubble);
      await wait(300);

      /* 开工前请主公过目。执行是最贵的一步（几十秒 + 写文件）——
         先让主公看定稿的单子，免得跑完才发现方向不对。 */
      say(ztBubble, '附议已定，请主公过目。');
      var goAhead = await askRoyal(
        '附议已定。主公准了臣就开工；要改就退回重下一单。',
        [{ label: '准了，开工', value: 'go' }, { label: '退回重拆', value: 'back' }]
      );
      if(goAhead !== 'go'){
        setPhase(0);
        await closeScroll(true);
        req.value = lastRequirement;
        composer.classList.remove('fold');
        send.disabled = false;
        busy = false;
        say(ztBubble, '臣把这单退回。请主公改一句需求，臣重下一单。');
        req.focus();
        return;
      }
      say(ztBubble, '臣领旨，开工。');
      await wait(600);
    }else{
      var dissent = byName('兵部');
      for(var j=0;j<MEMBERS.length;j++){
        var m = MEMBERS[j];
        setState(m, 'thinking', '思忖');
        await wait(230);
        if(!m.line){ setState(m, 'idle'); continue; }
        if(m === dissent){ shout(m, m.line, true); setState(m, 'blocked', '异议'); }
        else { shout(m, m.line); setState(m, 'done', m.line); }
      }
      await wait(700);

      /* 中堂处理异议。单子条数由模型定（2–5 条），「第 4 条」不能写死 */
      var r4 = rows[fixIdx] || null;
      var NEW_ACT = '做可视化原型（一期静态场景）';
      var NEW_OUT = '可运行 demo';
      say(ztBubble, '兵部说得是。第 ' + (fixIdx + 1) + ' 条工期不足，拆为两期：先出静态场景，再上动效。');
      if(r4){
        r4.classList.add('changed');
        var actEl2 = r4.querySelector('.act');
        var outEl2 = r4.querySelector('.out');
        if(actEl2) actEl2.textContent = NEW_ACT;
        if(outEl2) outEl2.textContent = '→ ' + NEW_OUT;
      }
      amendOrder(fixIdx, NEW_ACT, NEW_OUT);
      var note2 = scrollInner.querySelector('#scNote');
      if(note2){
        note2.textContent = '改单记录：第 ' + (fixIdx + 1) + ' 条由「场景与动效」拆为两期，一期只做静态场景。依据：兵部异议。';
        note2.classList.add('show');
      }
      rememberPage('改后');
      await wait(2100);
      setState(dissent, 'done', '已改单');
      hideBubble(ztBubble);
      await wait(400);

      /* 附议第二轮：异议已改，兵部改口。刑部仍不说话。 */
      MEMBERS.forEach(function(mm, i){
        if(!mm.line) return;
        var text = mm.line2 || mm.line;
        setTimeout(function(){
          shout(mm, text, false);
          setState(mm, 'done', text);
        }, i * 70 / speed);
      });
      await wait(900);
      say(ztBubble, '清单已定，开始执行。');
      await wait(1100);
      hideBubble(ztBubble);
    }

    /* 9 执行：等人写文件时，六司和中堂各自随机开口，可以同时说 */
    setPhase(3);
    var runList = LIVE_TASKS || TASKS;
    EXEC = null;
    var CHATTER = {
      '吏部': ['人按单来', '这一条归我', '职责已定'],
      '户部': ['材料够用', '预算还在', '我这边齐了'],
      '礼部': ['措辞我来改', '对外就这么说', '样子还要再看'],
      '兵部': ['难处我来扛', '这一段我在写', '先把硬的做完'],
      '工部': ['我来收口', '收成一件', '成品我在装'],
      '刑部': ['我先看着', '做完我再核', '证据要留下'],
      '中堂': ['按单做', '不必争了', '写完即报']
    };
    var chatterTimers = [];
    function stopWorkTalk(){
      chatterTimers.forEach(function(id){ clearTimeout(id); });
      chatterTimers = [];
    }
    function armChatter(name){
      var delay = 700 + Math.random() * 2600;
      var id = setTimeout(function(){
        var lines = CHATTER[name];
        var line = lines[Math.floor(Math.random() * lines.length)];
        if(name === '中堂'){ say(ztBubble, line); }
        else {
          var speaker = byName(name);
          if(speaker) shout(speaker, line);
        }
        armChatter(name);
      }, delay);
      chatterTimers.push(id);
    }
    function startWorkTalk(){
      stopWorkTalk();
      Object.keys(CHATTER).forEach(armChatter);
    }
    if(LIVE && LIVE_ORDER){
      say(ztBubble, '各司动身，写入案卷。');
      startWorkTalk();
      var execResult = await fetchExecute(LIVE_ORDER, text, ATTEST, function(ev){
        if(ev.orderNo){
          orderNo = ev.orderNo;
          var noEl = scrollInner.querySelector('.sc-no');
          if(noEl) noEl.textContent = '编号 ' + orderNo;
        }
        var row = (ev.index === 0 || ev.index) ? rows[ev.index] : null;
        var who = ev.dept ? byName(ev.dept) : null;
        if(ev.type === 'execute/working'){
          if(who) setState(who, 'thinking', '执行');
          if(row) row.classList.add('running');
        }else if(ev.type === 'execute/task'){
          if(who) setState(who, ev.ok ? 'done' : 'blocked', ev.ok ? '交活' : '未成');
          if(row){
            row.classList.remove('running');
            row.classList.add(ev.ok ? 'done' : 'reject');
            var mark = row.querySelector('.mark');
            if(mark) mark.textContent = ev.ok ? '✓' : '✗';
          }
        }else if(ev.type === 'verify/start'){
          /* 勘验开始：五司退开，只留刑部在场 */
          stopWorkTalk();
          setPhase(4);
          MEMBERS.forEach(function(mm){ if(mm.name !== '刑部') mm.el.classList.add('dim'); });
          var xing = byName('刑部');
          if(xing){ xing.el.classList.add('lit'); setState(xing, 'thinking', '勘验'); }
          say(ztBubble, '刑部核证，其余各司退开。');
        }else if(ev.type === 'verify/verdict'){
          var judge = byName('刑部');
          /* 补交过的这一司核完就退回暗处——不能让它一直亮着 */
          if(ev.retried && ev.dept && ev.dept !== '刑部'){
            var fixed = byName(ev.dept);
            if(fixed){
              fixed.el.classList.remove('lit');
              fixed.el.classList.add('dim');
              setState(fixed, ev.ok ? 'done' : 'blocked', ev.ok ? '已补' : '仍未成');
            }
          }
          if(ev.ok){
            if(judge) shout(judge, ev.retried ? '补核过' : '核');
            if(row){
              row.classList.remove('running');
              row.classList.remove('reject');
              row.classList.add('done');
              var okMark = row.querySelector('.mark');
              if(okMark) okMark.textContent = '✓';
              var okWhy = row.querySelector('.why');
              if(okWhy){
                if(ev.retried){ okWhy.textContent = '补交后核过'; okWhy.classList.add('ok'); }
                else { okWhy.remove(); }
              }
            }
          }else{
            if(judge) shout(judge, '退', true);
            if(row){
              row.classList.remove('running');
              row.classList.add('reject');
              var noMark = row.querySelector('.mark');
              if(noMark) noMark.textContent = '✗';
              /* 理由要留在单子上——只打个 ✗，主公不知道凭什么退 */
              if(ev.reason){
                var why = row.querySelector('.why');
                if(!why){
                  why = document.createElement('div');

      setTimeout(function(){ recess(); }, 500);
    }else if(poseM[1] === 'verify'){
      setPhase(4);
      scrollInner.innerHTML = orderHTML('把「升堂工作流」做成一个能看的朝堂场景：输入需求、点升堂、惊堂木一响，六司齐呼，中堂出来拆单、收附议，刑部独立勘验后汇总。');
      scrollEl.classList.add('open');
      Array.prototype.forEach.call(scrollInner.querySelectorAll('.t-row'), function(r, i){
        r.classList.add('in','done');
        r.querySelector('.mark').textContent = '核';
        if(i === 3){
          r.classList.add('reject');
          r.querySelector('.mark').textContent = '✗';
          var w = document.createElement('div');
          w.className = 'why';
          w.textContent = '刑部退回：只有结论、没有证据，缺可复核的做法与数字';
          r.appendChild(w);
        }
      });
      MEMBERS.forEach(function(m){ if(m.name !== '刑部') m.el.classList.add('dim'); });
      say(ztBubble, '第 4 条只有结论、没有证据。退回工部补交。', true);
    }else{
      setPhase(6);
      scrollInner.innerHTML = resultHTML();
      scrollEl.classList.add('open');
      verdict.classList.add('show');
    }
  }

})();
</script>
</body>
</html>
